# Purpose: build the .rbz and open a draft GitHub release when a version tag is pushed.
#
# Why tags and not commit messages: the old workflow scanned every push to main for the text
# "Release version x.y.z" and then pushed a version bump back to main from a bot, which bypassed
# review. Now the maintainer bumps VERSION in a reviewed PR, merges, and pushes the tag. The
# workflow refuses to release if the tag and VERSION disagree.
name: Release

on:
  push:
    tags: ['v*']
  # Dry run: the same check and zip, an artifact instead of a release. Run it
  # once with a wrong tag (red at the check) and once with the current VERSION
  # (green, artifact) before trusting a real tag push.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to simulate, for example v5.5.4. Must match VERSION to pass.
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check that the tag matches VERSION
        id: version
        run: |
          set -e
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          VERSION=$(sed -n "s/.*VERSION = '\(.*\)'.*/\1/p" src/bt_ifcmanager.rb)
          echo "tag=$TAG version=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match VERSION '$VERSION' in src/bt_ifcmanager.rb"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the .rbz
        run: |
          set -e
          cd src && zip -qr "../bt_ifcmanager-${{ steps.version.outputs.version }}.rbz" .
          ls -l ../bt_ifcmanager-*.rbz

      - name: Upload the .rbz as a dry-run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rbz-dry-run
          path: bt_ifcmanager-*.rbz

      - name: Create draft release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          name: Sketchup-IFC-Manager ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: bt_ifcmanager-${{ steps.version.outputs.version }}.rbz
